name: hearsay

services:
  database:
    image: cockroachdb/cockroach:v26.1.6
    command:
      - start-single-node
      - --insecure
      - --store=/cockroach/cockroach-data
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach-data:/cockroach/cockroach-data
    healthcheck:
      test:
        - CMD
        - cockroach
        - node
        - status
        - --insecure
        - --host=localhost:26257
      interval: 5s
      timeout: 5s
      retries: 20

  database-init:
    image: cockroachdb/cockroach:v26.1.6
    depends_on:
      database:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >
        cockroach sql --insecure --host=database:26257
        --execute='CREATE DATABASE IF NOT EXISTS hearsay;
        CREATE DATABASE IF NOT EXISTS hearsay_test;'
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HEARSAY_ENV: development
      HEARSAY_WEB_ORIGIN: http://localhost:3000
      HEARSAY_PERSISTENCE_BACKEND: cockroachdb
      DATABASE_URL: cockroachdb+psycopg://root@database:26257/hearsay?sslmode=disable
    ports:
      - "8000:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cockroach-data:
